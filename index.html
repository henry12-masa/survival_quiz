{q:"災害後の片付けを一人で無理しない理由は？",c:["けがや疲労を防ぐため","早く終わるから","荷物が増えるから","音が出るから"],a:"けがや疲労を防ぐため"},
{q:"サバイバルで最終的に大切なのは？",c:["冷静な判断と安全確保","目立つこと","無理をすること","全部一人でやること"],a:"冷静な判断と安全確保"}
];

const QUESTION_COUNT = 50;
let quizData = [];
let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const resultEl = document.getElementById("result");
const progressEl = document.getElementById("progress");
const restartBtn = document.getElementById("restartBtn");

function shuffleArray(array){
  const copied = [...array];
  for(let i = copied.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copied[i], copied[j]] = [copied[j], copied[i]];
  }
  return copied;
}

function startQuiz(){
  quizData = shuffleArray(allQuestions).slice(0, QUESTION_COUNT);
  currentQuestion = 0;
  score = 0;
  restartBtn.style.display = "none";
  loadQuestion();
}

function loadQuestion(){
  answered = false;
  resultEl.textContent = "";
  const q = quizData[currentQuestion];

  progressEl.textContent = `${currentQuestion + 1} / ${quizData.length}問目　正解数：${score}`;
  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";

  shuffleArray(q.c).forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice;
    btn.onclick = () => checkAnswer(btn, choice);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(button, choice){
  if(answered) return;
  answered = true;

  const correctAnswer = quizData[currentQuestion].a;
  const buttons = choicesEl.querySelectorAll("button");

  buttons.forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === correctAnswer){
      btn.classList.add("correct");
    }
  });

  if(choice === correctAnswer){
    score++;
    resultEl.textContent = "正解！";
    button.classList.add("correct");
  }else{
    resultEl.textContent = `不正解… 正解は「${correctAnswer}」`;
    button.classList.add("wrong");
  }

  setTimeout(() => {
    currentQuestion++;
    if(currentQuestion < quizData.length){
      loadQuestion();
    }else{
      showFinalResult();
    }
  }, 1200);
}

function showFinalResult(){
  questionEl.textContent = "クイズ終了！";
  choicesEl.innerHTML = "";
  resultEl.innerHTML = `あなたの正解数は <strong>${score} / ${quizData.length}</strong> 問です。`;
  progressEl.textContent = "";
  restartBtn.style.display = "inline-block";
}

function restartQuiz(){
  startQuiz();
}

startQuiz();
</script>
